<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão — TacticalGIS</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #121212;
        color: #f2f2ef;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 24px;
        text-align: center;
      }
      .caixa {
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        padding: 32px 24px;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.03);
      }
      h1 {
        color: #ff6b35;
        font-size: 20px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin: 0 0 12px;
      }
      p {
        color: #b3b3ad;
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      button {
        min-height: 56px;
        min-width: 56px;
        padding: 0 28px;
        border: 0;
        border-radius: 6px;
        background: #ff6b35;
        color: #121212;
        font: 700 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .dica {
        margin-top: 20px;
        font-size: 11px;
        color: #7c7c76;
      }
    </style>
  </head>
  <body>
    <main class="caixa">
      <h1>Sem conexão</h1>
      <p>
        Não foi possível alcançar a rede agora. O aplicativo continua funcionando com os dados
        salvos neste aparelho — abra novamente para usar o modo offline.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
      <p class="dica">Manual do Sobrevivente — TacticalGIS</p>
    </main>
  </body>
</html>
